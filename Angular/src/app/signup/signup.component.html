<div align="center">
  <h1> User Registration </h1>

  <h3 style="color: red;"> {{ form.errorMessage }} </h3>
  <h3 style="color: green;"> {{ form.successMessage }} </h3>
  <form (submit)="signUp()">
    <table>
      <tr>
        <th>First Name:</th>
        <td><input type="text" name="firstName" [(ngModel)]="form.data.firstName" placeholder="Enter your first name"
            required></td>
            <td style="color: RED;">{{form.inputerror.firstName}}</td>
      </tr>
      <tr>
        <th>Last Name:</th>
        <td><input type="text" name="lastName" [(ngModel)]="form.data.lastName" placeholder="Enter your last name" required>
        </td>
        <td style="color: red;">{{form.inputerror.lastName}}</td>
      </tr>
      <tr>
        <th>Login:</th>
        <td><input type="text" name="login" [(ngModel)]="form.data.login" placeholder="Enter your login" required></td>
        <td style="color: red;">{{form.inputerror.login}}</td>
      </tr>
      <tr>
        <th>Password:</th>
        <td><input type="password" name="password" [(ngModel)]="form.data.password" placeholder="Enter your password"
            required></td>
            <td style="color: red;">{{form.inputerror.password}}</td>
      </tr>
      <tr>
        <th>Date of Birth:</th>
        <td><input type="date" name="dob" [(ngModel)]="form.data.dob" required></td>
        <td style="color: red;">{{form.inputerror.dob}}</td>
      </tr>

      <tr>
        <th></th>
        <td colspan="2"><input type="submit" value="Sign up"></td>
      </tr>
    </table>
  </form>
</div>
